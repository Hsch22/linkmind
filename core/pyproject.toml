[project]
name = "linkmind-core"
version = "0.0.1"
description = "LinkMind Core: evidence-backed relationship memory behind a WeChat agent"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.6",
    "mcp>=2.3",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pillow>=12.0",
    "openai>=3.46.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
linkmind-mcp = "linkmind.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkmind"]
